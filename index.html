<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sieve 节点订阅</title><link rel="stylesheet" href="styles.css"></head>
<body><main><h1>Sieve</h1><p>速度为 MB/s，延迟为代理 HTTPS 请求时间。稳定与高速标签来自网页和下载实测。</p>
<nav><button data-location="mainland">大陆实测</button><button data-location="cloud">云端实测</button></nav>
<p id="status" role="status">读取结果…</p><p id="coverage" class="details"></p><p id="probe-coverage" class="details"></p><details><summary>来源与覆盖说明</summary><p>候选包含本轮上游节点和同地点上一轮最终收录的节点，按连接参数去重，历史节点优先重新检测。基础检测只验证连接，发布前还要复检；未完成基础检测的节点不会发布。专项统计只针对本页已发布节点。“结果有效期”是检测结果的最长保留时间，不保证节点此刻仍在线。</p><div id="sources"></div></details><p><a id="shadowrocket" href="#">小火箭订阅</a> · <a id="uri" href="#">URI 通用订阅</a> · <a id="clash" href="#">Clash / Mihomo</a></p>
<p>专项订阅：<a id="web" href="#">网页</a> · <a id="download" href="#">下载</a></p><p id="format-coverage" class="details"></p>
<label>排序 <select id="sort"><option value="default">综合</option><option value="speed">速度</option><option value="latency">延迟</option></select></label>
<label>国家 <select id="country"><option value="">全部</option></select></label>
<div id="nodes"></div><p>国家是实际出口参考，不参与淘汰。检测只反映当时网络。</p></main><script src="app.js"></script></body></html>
